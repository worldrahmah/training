<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Engine ONE — Certificate</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/fonts-local.css"><link rel="stylesheet" href="/one-ui.css"><style>
body{margin:0;background:var(--bg,#f6f7fb)}.certificate-shell{min-height:100vh;display:grid;place-items:center;padding:32px}.certificate-sheet{width:min(1000px,94vw);background:#fff;color:#14171f;border-radius:28px;padding:64px;box-shadow:0 24px 80px rgba(18,24,40,.13);text-align:center;position:relative;overflow:hidden}.certificate-sheet:before{content:"";position:absolute;inset:16px;border:2px solid #d8dce7;border-radius:20px;pointer-events:none}.certificate-mark{font-size:38px;font-weight:850;letter-spacing:-.04em}.certificate-kicker{text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:#667085;margin-top:32px}.certificate-name{font-size:clamp(34px,6vw,66px);margin:18px 0}.certificate-course{font-size:clamp(24px,4vw,40px);margin:12px 0}.certificate-meta{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:32px;color:#475467}.certificate-code{font-family:ui-monospace,monospace;background:#f2f4f7;border-radius:999px;padding:8px 14px}.certificate-actions{margin-top:32px;display:flex;gap:10px;justify-content:center}@media print{body{background:#fff}.certificate-shell{padding:0}.certificate-sheet{box-shadow:none;width:100%;min-height:90vh;border-radius:0}.certificate-actions{display:none}}
